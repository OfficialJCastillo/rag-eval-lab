<svg xmlns="http://www.w3.org/2000/svg" width="980" height="436" viewBox="0 0 980 436" role="img" aria-labelledby="title desc">
  <title id="title">rag-eval-lab benchmark history trends</title>
  <desc id="desc">Separate MRR sparklines and latest-run changes for each retrieval strategy.</desc>
  <style>
    .bg { fill: #0b1020; }
    .title { fill: #f8fafc; font: 700 25px 'Inter', 'Segoe UI', sans-serif; }
    .subtitle { fill: #aebbd0; font: 500 14px 'Inter', 'Segoe UI', sans-serif; }
    .header { fill: #dbe5f3; font: 700 13px 'Inter', 'Segoe UI', sans-serif; }
    .row { fill: #121a2a; }
    .row-alt { fill: #0f1726; }
    .label { fill: #e2e8f0; font: 600 14px 'Inter', 'Segoe UI', sans-serif; }
    .track { stroke: #34425a; stroke-width: 2; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .point { stroke: #121a2a; stroke-width: 2; }
    .value { fill: #f8fafc; font: 650 13px 'Inter', 'Segoe UI', sans-serif; }
    .delta { fill: #cbd5e1; font: 600 13px 'Inter', 'Segoe UI', sans-serif; }
    .status { fill: #0b1020; font: 700 11px 'Inter', 'Segoe UI', sans-serif; text-anchor: middle; }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="436" rx="16"/>
  <text class="title" x="30" y="43">Benchmark history · MRR stability</text>
  <text class="subtitle" x="30" y="68">2 local comparison runs · one sparkline per strategy · shared 0–1 scale</text>

  <text class="header" x="36" y="108">Strategy</text>
  <text class="header" x="260" y="108">Oldest → latest</text>
  <text class="header" x="636" y="108">Latest MRR</text>
  <text class="header" x="752" y="108">Change</text>
  <text class="header" x="875" y="108">Status</text>
  <g data-strategy="embedding">
    <rect class="row" x="20" y="124" width="940" height="50" rx="10"/>
    <text class="label" x="36" y="155">embedding</text>
    <line class="track" x1="260" y1="149" x2="590" y2="149"/>
    <path class="line" d="M 260.00 137.00 L 590.00 137.00" stroke="#60a5fa"/>
    <circle class="point" cx="260.00" cy="137.00" r="4.5" fill="#60a5fa"/>
    <circle class="point" cx="590.00" cy="137.00" r="4.5" fill="#60a5fa"/>
    <text class="value" x="636" y="155">0.8750</text>
    <text class="delta" x="752" y="155">0.0000</text>
    <rect x="856" y="139" width="88" height="22" rx="11" fill="#6ee7b7"/>
    <text class="status" x="900" y="154">stable</text>
  </g>
  <g data-strategy="embedding_strong">
    <rect class="row row-alt" x="20" y="182" width="940" height="50" rx="10"/>
    <text class="label" x="36" y="213">embedding strong</text>
    <line class="track" x1="260" y1="207" x2="590" y2="207"/>
    <path class="line" d="M 260.00 195.00 L 590.00 195.00" stroke="#34d399"/>
    <circle class="point" cx="260.00" cy="195.00" r="4.5" fill="#34d399"/>
    <circle class="point" cx="590.00" cy="195.00" r="4.5" fill="#34d399"/>
    <text class="value" x="636" y="213">0.8750</text>
    <text class="delta" x="752" y="213">0.0000</text>
    <rect x="856" y="197" width="88" height="22" rx="11" fill="#6ee7b7"/>
    <text class="status" x="900" y="212">stable</text>
  </g>
  <g data-strategy="embedding_strong_rerank">
    <rect class="row" x="20" y="240" width="940" height="50" rx="10"/>
    <text class="label" x="36" y="271">embedding strong rerank</text>
    <line class="track" x1="260" y1="265" x2="590" y2="265"/>
    <path class="line" d="M 260.00 251.67 L 590.00 251.67" stroke="#a78bfa"/>
    <circle class="point" cx="260.00" cy="251.67" r="4.5" fill="#a78bfa"/>
    <circle class="point" cx="590.00" cy="251.67" r="4.5" fill="#a78bfa"/>
    <text class="value" x="636" y="271">0.9167</text>
    <text class="delta" x="752" y="271">0.0000</text>
    <rect x="856" y="255" width="88" height="22" rx="11" fill="#6ee7b7"/>
    <text class="status" x="900" y="270">stable</text>
  </g>
  <g data-strategy="keyword">
    <rect class="row row-alt" x="20" y="298" width="940" height="50" rx="10"/>
    <text class="label" x="36" y="329">keyword</text>
    <line class="track" x1="260" y1="323" x2="590" y2="323"/>
    <path class="line" d="M 260.00 309.67 L 590.00 309.67" stroke="#fbbf24"/>
    <circle class="point" cx="260.00" cy="309.67" r="4.5" fill="#fbbf24"/>
    <circle class="point" cx="590.00" cy="309.67" r="4.5" fill="#fbbf24"/>
    <text class="value" x="636" y="329">0.9167</text>
    <text class="delta" x="752" y="329">0.0000</text>
    <rect x="856" y="313" width="88" height="22" rx="11" fill="#6ee7b7"/>
    <text class="status" x="900" y="328">stable</text>
  </g>
  <g data-strategy="semantic">
    <rect class="row" x="20" y="356" width="940" height="50" rx="10"/>
    <text class="label" x="36" y="387">semantic</text>
    <line class="track" x1="260" y1="381" x2="590" y2="381"/>
    <path class="line" d="M 260.00 370.33 L 590.00 370.33" stroke="#fb923c"/>
    <circle class="point" cx="260.00" cy="370.33" r="4.5" fill="#fb923c"/>
    <circle class="point" cx="590.00" cy="370.33" r="4.5" fill="#fb923c"/>
    <text class="value" x="636" y="387">0.8333</text>
    <text class="delta" x="752" y="387">0.0000</text>
    <rect x="856" y="371" width="88" height="22" rx="11" fill="#6ee7b7"/>
    <text class="status" x="900" y="386">stable</text>
  </g>
</svg>
